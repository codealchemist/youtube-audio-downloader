<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src file:; base-uri 'none'; form-action 'none'"
    >
    <title>YouTube Audio Downloader</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <!-- The playing song's cover, blurred behind everything. -->
    <div id="backdrop" aria-hidden="true"></div>

    <svg class="sprite" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="5" width="4" height="14" rx="1"/><rect fill="currentColor" x="14" y="5" width="4" height="14" rx="1"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><rect fill="currentColor" x="5" y="5" width="2.5" height="14" rx="1"/><path fill="currentColor" d="M19 6.2v11.6a1 1 0 0 1-1.55.83L9.2 12.83a1 1 0 0 1 0-1.66l8.25-5.8A1 1 0 0 1 19 6.2z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><rect fill="currentColor" x="16.5" y="5" width="2.5" height="14" rx="1"/><path fill="currentColor" d="M5 6.2v11.6a1 1 0 0 0 1.55.83l8.25-5.8a1 1 0 0 0 0-1.66L6.55 5.37A1 1 0 0 0 5 6.2z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></g></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></g></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></g></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></g></symbol>
      <symbol id="i-retry" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></g></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></g></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></g></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></g></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></g></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5L6 9H3v6h3l5 4z"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></g></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5L6 9H3v6h3l5 4z"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 9l5 6M21 9l-5 6"/></g></symbol>
    </svg>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><svg class="icon"><use href="#i-play"/></svg></span>
        <span class="brand-name"><b>YouTube</b> Audio Downloader</span>
        <span id="version" class="version" data-testid="version"></span>
      </div>
      <div class="folder-chip">
        <svg class="icon"><use href="#i-folder"/></svg>
        <span class="folder-label">Saving to</span>
        <span class="folder-path"><bdi id="folder" dir="ltr" data-testid="folder"></bdi></span>
        <button id="change-folder" class="chip-button" type="button">Change</button>
      </div>
    </header>

    <p id="warning" class="warning" data-testid="warning" role="alert" hidden></p>

    <form id="add-form" class="add-bar" autocomplete="off">
      <svg class="icon"><use href="#i-link"/></svg>
      <input
        name="video-input"
        id="video-input"
        placeholder="Paste YouTube links or video ids"
        aria-label="YouTube links or video ids"
        spellcheck="false"
        autofocus
      />
      <button class="primary" type="submit">Add to queue</button>
    </form>

    <main class="content">
      <section class="panel library" aria-labelledby="library-title">
        <div class="panel-head">
          <h2 id="library-title">Library <span id="song-count" class="count"></span></h2>
          <div class="panel-tools">
            <label class="search">
              <svg class="icon"><use href="#i-search"/></svg>
              <input id="search" type="search" placeholder="Search" aria-label="Search songs" spellcheck="false">
            </label>
            <select id="sort" aria-label="Sort songs">
              <option value="newest">Newest</option>
              <option value="name">Name</option>
            </select>
          </div>
        </div>
        <ul id="songs" class="list" data-testid="songs" aria-label="Songs"></ul>
        <div id="songs-empty" class="empty" hidden>
          <svg class="icon"><use href="#i-music"/></svg>
          <p id="songs-empty-text">No songs yet. Paste a YouTube link above to save its audio here.</p>
        </div>
      </section>

      <section class="panel queue" aria-labelledby="queue-title">
        <div class="panel-head">
          <h2 id="queue-title">Downloads <span id="queue-count" class="count"></span></h2>
          <button id="clear-finished" class="ghost" type="button" hidden>Clear completed</button>
        </div>
        <ul id="queue" class="list" data-testid="queue" aria-label="Downloads"></ul>
        <div id="queue-empty" class="empty">
          <svg class="icon"><use href="#i-download"/></svg>
          <p>Paste one link or many. They download one after another.</p>
        </div>
      </section>
    </main>

    <footer id="player" class="player" data-testid="player">
      <div class="now">
        <div id="cover" class="cover" data-testid="cover">
          <svg class="icon"><use href="#i-music"/></svg>
        </div>
        <div class="now-text">
          <div id="now-title" class="now-title" data-testid="now-title">Nothing playing</div>
          <div id="now-artist" class="now-artist"></div>
        </div>
      </div>
      <div class="transport">
        <div class="transport-buttons">
          <button id="prev" class="icon-button" type="button" aria-label="Previous" title="Previous"><svg class="icon"><use href="#i-prev"/></svg></button>
          <button id="play" class="play-button" type="button" aria-label="Play" title="Play"><svg class="icon"><use href="#i-play"/></svg></button>
          <button id="next" class="icon-button" type="button" aria-label="Next" title="Next"><svg class="icon"><use href="#i-next"/></svg></button>
        </div>
        <div class="seek-row">
          <span id="time-current" class="time">0:00</span>
          <input id="seek" class="range" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
          <span id="time-total" class="time">0:00</span>
        </div>
      </div>
      <div class="extras">
        <button id="share-current" class="icon-button" type="button" aria-label="Share" title="Share" disabled><svg class="icon"><use href="#i-share"/></svg></button>
        <button id="mute" class="icon-button" type="button" aria-label="Mute" title="Mute"><svg class="icon"><use href="#i-volume"/></svg></button>
        <input id="volume" class="range volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </footer>

    <div id="toast" class="toast" data-testid="toast" role="status" aria-live="polite" hidden></div>
    <audio id="audio" preload="metadata"></audio>

    <template id="song-template">
      <li class="song">
        <span class="thumb">
          <span class="thumb-letter"></span>
          <span class="thumb-play"><svg class="icon"><use href="#i-play"/></svg></span>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </span>
        <button class="song-main" type="button">
          <span class="song-title"></span>
          <span class="song-meta"></span>
        </button>
        <span class="row-actions">
          <button class="icon-button" type="button" data-action="rename" aria-label="Rename" title="Rename"><svg class="icon"><use href="#i-edit"/></svg></button>
          <button class="icon-button" type="button" data-action="share" aria-label="Share" title="Share"><svg class="icon"><use href="#i-share"/></svg></button>
          <button class="icon-button danger" type="button" data-action="delete" aria-label="Delete" title="Delete"><svg class="icon"><use href="#i-trash"/></svg></button>
        </span>
      </li>
    </template>

    <template id="job-template">
      <li class="job">
        <span class="job-icon" aria-hidden="true">
          <span class="spinner"></span>
          <svg class="icon icon-queued"><use href="#i-clock"/></svg>
          <svg class="icon icon-done"><use href="#i-check"/></svg>
          <svg class="icon icon-failed"><use href="#i-alert"/></svg>
        </span>
        <span class="job-text">
          <span class="job-title"></span>
          <span class="job-status"></span>
          <span class="bar"><span class="bar-fill"></span></span>
        </span>
        <span class="row-actions">
          <button class="icon-button" type="button" data-action="play" aria-label="Play" title="Play"><svg class="icon"><use href="#i-play"/></svg></button>
          <button class="icon-button" type="button" data-action="retry" aria-label="Retry" title="Retry"><svg class="icon"><use href="#i-retry"/></svg></button>
          <button class="icon-button" type="button" data-action="remove" aria-label="Remove" title="Remove"><svg class="icon"><use href="#i-close"/></svg></button>
        </span>
      </li>
    </template>

    <script src="format.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
